<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>India Time • IST</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- Liquid Background -->
    <div class="liquid-bg">

        <div class="blob blob-one"></div>
        <div class="blob blob-two"></div>
        <div class="blob blob-three"></div>
        <div class="blob blob-four"></div>

    </div>


   
    <nav class="navbar">

        <div class="logo">

            <span class="india-icon">🇮🇳</span>

            <span>India Time</span>

        </div>


        <div class="nav-links">

            <a href="./index.html" class="active">
                <span>🕐</span>
                Time & Date
            </a>


            <a href="./pages/timer.html">
                <span>⏱️</span>
                Timer
            </a>


            <a href="./pages/alarm.html">
                <span>⏰</span>
                Alarm
            </a>


            <!-- Manual Offline Mode -->
            <a href="./offline.html" class="offline-link">
                <span>📴</span>
                Offline
            </a>

        </div>

    </nav>


    

    <main class="container">

        <section class="time-card">

            <div class="card-glow"></div>


            <!-- TOP INFO -->

            <div class="top-info">

                <div class="location">

                    <span class="location-icon">
                        🇮🇳
                    </span>


                    <div>

                        <strong>
                            INDIA
                        </strong>

                        <small>
                            Indian Standard Time
                        </small>

                    </div>

                </div>


                <div class="live-badge">

                    <span class="live-dot"></span>

                    LIVE

                </div>

            </div>


            <!-- CLOCK -->

            <div class="clock-area">

                <p class="timezone">
                    IST • UTC +05:30
                </p>


                <h1 id="india-time">
                    --:--:--
                </h1>


                <h2 id="india-date">
                    Loading date...
                </h2>

            </div>


            <!-- BOTTOM INFO -->

            <div class="bottom-info">

                <div class="server-status">

                    <span class="status-icon">
                        ☁️
                    </span>


                    <div>

                        <span class="status-title">
                            Online Time Server
                        </span>


                        <span id="status">
                            Connecting...
                        </span>

                    </div>

                </div>


                <div class="source-badge">
                    IST
                </div>

            </div>

        </section>

    </main>




    <script
        type="module"
        src="./js/app.js">
    </script>

</body>

</html>
